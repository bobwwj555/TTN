; TTN Logger Config
; LOCATION: /etc/ttn-logger.conf  (on tn.w4bww.net)
; Permissions: chmod 600 /etc/ttn-logger.conf

; TTN portal API endpoint
portal_url = https://dev.ttn.radio/api/telemetry-receive.php

; Shared secret — must match telemetry_secret in site_settings on portal
; Generate with: openssl rand -hex 32
portal_secret = CHANGE_ME_RANDOM_SECRET_HERE

; Local log file
log_local = /var/log/ttn-telemetry.log
